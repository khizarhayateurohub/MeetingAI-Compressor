<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MeetingAI Compressor</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 30px;
      background: #f5f7fb;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    input {
      margin: 20px 0;
      width: 100%;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>MeetingAI Compressor</h1>

  <p>
    Compress meeting audio or video before sending it to MeetingAI.
  </p>

  <input
    type="file"
    id="fileInput"
    accept="audio/*,video/*"
  >

  <br>

  <button id="compressBtn">
    Compress Recording
  </button>

  <div id="status">
    No file selected
  </div>

</div>

<!-- FFmpeg library -->
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

<!-- Our compressor -->
<script src="./compressor.js"></script>

</body>
</html>
