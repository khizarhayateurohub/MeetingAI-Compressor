<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MeetingAI Compressor</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 50px 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    .file-box {
      margin: 25px 0;
    }

    input[type="file"] {
      width: 100%;
      padding: 10px 0;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 13px 22px;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 6px;
      min-height: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>MeetingAI Compressor</h1>

  <p>
    Compress meeting audio or video before sending it to MeetingAI.
  </p>

  <div class="file-box">

    <input
      type="file"
      id="fileInput"
      accept="audio/*,video/*"
    >

  </div>

  <button
    id="compressBtn"
    type="button"
  >
    Compress Recording
  </button>

  <div id="status">
    No file selected
  </div>

</div>

<!-- FFmpeg -->
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

<!-- MeetingAI compressor -->
<script src="./compressor.js"></script>

</body>
</html>
