<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MeetingAI Compressor</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .container {
      width: min(900px, 92%);
      margin: 50px auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    h1 { margin-top: 0; }

    .subtitle {
      color: #6b7280;
      margin-bottom: 30px;
    }

    .upload-box {
      border: 2px dashed #cbd5e1;
      border-radius: 15px;
      padding: 35px;
      text-align: center;
      margin-bottom: 25px;
    }

    input[type=file] {
      width: 100%;
      padding: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 25px;
      padding: 18px;
      background: #f1f5f9;
      border-radius: 10px;
      white-space: pre-wrap;
    }

    .progress {
      width: 100%;
      height: 10px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 15px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #2563eb;
      transition: width .3s;
    }

    .download {
      display: none;
      margin-top: 20px;
      text-align: center;
    }

    .download a {
      display: inline-block;
      padding: 14px 25px;
      background: #16a34a;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .file-info {
      margin-top: 15px;
      color: #475569;
      font-size: 14px;
    }
  </style>

</head>

<body>

<div class="container">

  <div class="card">

    <h1>MeetingAI Compressor</h1>

    <div class="subtitle">
      Compress meeting audio or video before sending it to MeetingAI.
    </div>

    <div class="upload-box">

      <input
        type="file"
        id="fileInput"
        accept="audio/*,video/*"
      >

      <div id="fileInfo" class="file-info">
        No file selected
      </div>

    </div>

    <button id="compressButton" disabled>
      Compress Recording
    </button>

    <div class="status">

      <strong>Status</strong>

      <div id="statusText">
        Select an audio or video file.
      </div>

      <div class="progress">

        <div
          id="progressBar"
          class="progress-bar">
        </div>

      </div>

    </div>

    <div id="downloadBox" class="download">

      <a id="downloadLink" href="#">
        Download Compressed File
      </a>

    </div>

  </div>

</div>

<!-- Load our JavaScript -->
<script src="compressor.js"></script>

</body>
</html>
